name: tmp-qhz-candidate-review
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_generate_candidates.py'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Generate candidates
        run: python scripts/_tmp_qhz_generate_candidates.py
      - name: Package candidate review
        run: |
          cd _tmp_qhz_candidates
          zip -r ../qinghuazhi-candidate-review.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qinghuazhi-candidate-review
          path: qinghuazhi-candidate-review.zip
          compression-level: 0
