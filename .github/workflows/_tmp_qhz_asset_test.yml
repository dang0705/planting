name: tmp-qhz-final-reviewed-pack
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_build_final_pack.py'
      - 'scripts/_tmp_qhz_final_titles.json'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Build reviewed pack
        run: python scripts/_tmp_qhz_build_final_pack.py
      - name: Package final artifact
        run: |
          cd _tmp_qhz_final
          zip -r ../qinghuazhi-mvp-plant-images-reviewed-final.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qinghuazhi-mvp-plant-images-reviewed-final
          path: qinghuazhi-mvp-plant-images-reviewed-final.zip
          compression-level: 0
