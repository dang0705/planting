name: tmp-qhz-patch-three
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_patch_three.py'
      - 'scripts/_tmp_qhz_build_final_pack.py'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Build patch images
        run: python scripts/_tmp_qhz_patch_three.py
      - name: Package patch
        run: |
          cd _tmp_qhz_patch_three
          zip -r ../qinghuazhi-patch-three.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qinghuazhi-patch-three
          path: qinghuazhi-patch-three.zip
          compression-level: 0
