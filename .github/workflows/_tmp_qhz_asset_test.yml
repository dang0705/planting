name: tmp-qhz-closeup-patch-part1-split
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_build_closeup_patch_part1_split.py'
      - 'scripts/_tmp_qhz_build_closeup_patch.py'
      - 'scripts/_tmp_qhz_closeup_replacements.json'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sub: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Build split patch
        env:
          SUB_INDEX: ${{ matrix.sub }}
          SUB_COUNT: 4
        run: python scripts/_tmp_qhz_build_closeup_patch_part1_split.py
      - name: Package patch
        run: |
          cd _tmp_qhz_closeup_patch_0
          zip -r ../qhz-closeup-patch-part1-${{ matrix.sub }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qhz-closeup-patch-part1-${{ matrix.sub }}
          path: qhz-closeup-patch-part1-${{ matrix.sub }}.zip
          compression-level: 0
