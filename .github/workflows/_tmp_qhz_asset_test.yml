name: tmp-qhz-targeted-candidate-review
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_targeted_candidates.py'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Generate targeted candidates
        env:
          PART_INDEX: ${{ matrix.part }}
          PART_COUNT: 4
        run: python scripts/_tmp_qhz_targeted_candidates.py
      - name: Package targeted review
        run: |
          cd _tmp_qhz_targeted_${{ matrix.part }}
          zip -r ../qinghuazhi-targeted-${{ matrix.part }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qinghuazhi-targeted-${{ matrix.part }}
          path: qinghuazhi-targeted-${{ matrix.part }}.zip
          compression-level: 0
