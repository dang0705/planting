name: tmp-qhz-round2-patch-build
on:
  push:
    branches: ['tmp/qhz-asset-test']
    paths:
      - '.github/workflows/_tmp_qhz_asset_test.yml'
      - 'scripts/_tmp_qhz_build_round2_patch.py'
      - 'scripts/_tmp_qhz_round2_replacements.json'
      - 'docs/plant_catalog.csv'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Build round2 patch
        env:
          PART_INDEX: ${{ matrix.part }}
          PART_COUNT: 4
        run: python scripts/_tmp_qhz_build_round2_patch.py
      - name: Package patch
        run: |
          cd _tmp_qhz_round2_patch_${{ matrix.part }}
          zip -r ../qhz-round2-patch-${{ matrix.part }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: qhz-round2-patch-${{ matrix.part }}
          path: qhz-round2-patch-${{ matrix.part }}.zip
          compression-level: 0
