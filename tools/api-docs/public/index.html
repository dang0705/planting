<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青花植 API 文档</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#142033;font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}.top{padding:30px max(24px,calc((100% - 1280px)/2));background:#10233f;color:#fff}.top h1{margin:0;font-size:28px}.top p{margin:8px 0 0;color:#c9d7e8}.layout{max-width:1280px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:240px 1fr;gap:22px}.sidebar{position:sticky;top:16px;height:max-content}.config,.card{background:#fff;border:1px solid #e5eaf1;border-radius:12px;box-shadow:0 3px 12px #1729470a}.config{padding:16px}.config label,.field label{display:block;font-size:12px;font-weight:700;color:#536174;margin:10px 0 4px}.config input,.editor,textarea{width:100%;border:1px solid #d9e1eb;border-radius:7px;padding:8px;font:12px ui-monospace,SFMono-Regular,monospace}.nav{margin-top:14px}.nav button{display:block;width:100%;padding:8px 10px;border:0;border-radius:7px;background:transparent;text-align:left;color:#334155;cursor:pointer}.nav button:hover{background:#eaf2ff}.content{min-width:0}.category{margin-bottom:30px}.category h2{font-size:18px;margin:0 0 4px}.muted{color:#637083}.card{margin:14px 0;overflow:hidden}.summary{padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}.method{font-weight:800;font-size:12px;border-radius:5px;padding:3px 7px;color:#fff;background:#2476d3}.method.POST{background:#24946a}.method.PUT{background:#d07920}.method.DELETE{background:#cf3d5a}.path{font:13px ui-monospace,SFMono-Regular,monospace;word-break:break-all}.name{font-size:16px;font-weight:700;margin-left:auto}.detail{display:none;border-top:1px solid #eef1f5;padding:16px}.card.open .detail{display:block}.card.open .summary{background:#fafcff}.tag{font-size:12px;background:#edf2f7;padding:2px 6px;border-radius:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{border-top:1px dashed #edf0f3;padding:7px 0}.field:first-child{border-top:0}.req{color:#cf3d5a;margin-left:4px}.desc{color:#526176;margin:3px 0}.example{display:block;color:#166534;font:11px ui-monospace,SFMono-Regular,monospace}.try{margin-top:18px;background:#f8fbff;border:1px solid #dceafb;border-radius:9px;padding:14px}.try h4{margin:0 0 8px}.buttons{display:flex;gap:8px;margin-top:8px}.buttons button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#1769c2;cursor:pointer}.buttons button.secondary{background:#64748b}.result{white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:#10233f;color:#d7e4f4;border-radius:7px;padding:10px;font:12px ui-monospace,SFMono-Regular,monospace}.warning{color:#9a5a00;background:#fff7df;padding:8px;border-radius:6px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.grid{grid-template-columns:1fr}.name{margin-left:0}.summary{flex-wrap:wrap}}
</style></head><body><header class="top"><h1>青花植 API 文档</h1><p>Swagger 风格 · 当前开发环境 · 目录来自现有 HTTP 调用契约</p></header><main class="layout"><aside class="sidebar"><section class="config"><strong>在线调试</strong><label>接口基础地址</label><input id="baseUrl"><label>临时会话令牌（远端接口需要）</label><input id="sessionToken" type="password" placeholder="仅在本次请求中使用，不保存"><p id="configHint" class="muted"></p></section><nav id="nav" class="nav"></nav></aside><section id="content" class="content"></section></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(title,items)=>`<h4>${title}</h4>${items.length?items.map(x=>`<div class="field"><label>${esc(x.name)}${x.required?'<span class="req">必填</span>':''}</label><div class="desc">${esc(x.description)}</div><code class="example">示例：${esc(JSON.stringify(x.example))}</code></div>`).join(''):'<p class="muted">无</p>'}`;
async function boot(){const [doc,config]=await Promise.all([fetch('/api/document').then(r=>r.json()),fetch('/api/config').then(r=>r.json())]);$('#baseUrl').value=config.apiBaseUrl;$('#configHint').textContent=`环境：${config.appEnv} · 本地网关端口：${config.localGatewayPort} · 本地开发身份：${config.hasLocalOpenid?'已配置':'未配置'}`;const nav=$('#nav'),content=$('#content');doc.categories.forEach(cat=>{const group=doc.endpoints.filter(e=>e.category===cat.id);if(!group.length)return;nav.insertAdjacentHTML('beforeend',`<button data-target="${cat.id}">${cat.name}（${group.length}）</button>`);content.insertAdjacentHTML('beforeend',`<section class="category" id="${cat.id}"><h2>${cat.name}</h2><p class="muted">${cat.description}</p>${group.map(card).join('')}</section>`)});nav.onclick=e=>{const id=e.target.dataset.target;if(id)$('#'+id).scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.summary').forEach(el=>el.onclick=()=>el.closest('.card').classList.toggle('open'));document.querySelectorAll('.send').forEach(button=>button.onclick=()=>call(button));}
function card(e){const payload=JSON.stringify(e.example,null,2);return `<article class="card"><div class="summary"><span class="method ${e.method}">${e.method}</span><code class="path">/${esc(e.path)}</code><span class="name">${esc(e.name)}</span></div><div class="detail"><p>${esc(e.description)}</p><p><span class="tag">${esc(e.auth)}</span></p>${e.caution?`<p class="warning">${esc(e.caution)}</p>`:''}<div class="grid"><div>${list('查询参数',e.query)}${list('请求体字段',e.body)}</div><div>${list('返回数据',e.response)}</div></div><section class="try"><h4>在线调用</h4><label>查询参数 JSON</label><textarea class="editor query">{}</textarea><label>请求体 JSON</label><textarea class="editor body">${esc(payload)}</textarea><div class="buttons"><button class="send" data-path="${esc(e.path)}" data-method="${e.method}">发送请求</button><button class="secondary reset" type="button">恢复示例</button></div><pre class="result">尚未发送请求</pre></section></div></article>`}
async function call(button){const box=button.closest('.try'),result=box.querySelector('.result');let query,body;try{query=JSON.parse(box.querySelector('.query').value||'{}');body=JSON.parse(box.querySelector('.body').value||'{}')}catch{result.textContent='参数必须是有效 JSON';return}button.disabled=true;result.textContent='请求中…';try{const r=await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:button.dataset.path,method:button.dataset.method,baseUrl:$('#baseUrl').value,sessionToken:$('#sessionToken').value,query,body})});result.textContent=JSON.stringify(await r.json(),null,2)}catch(e){result.textContent='请求失败：'+e.message}finally{button.disabled=false}}
boot().catch(error=>{$('#content').textContent='文档加载失败：'+error.message});
</script></body></html>
