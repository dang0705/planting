<svg xmlns="http://www.w3.org/2000/svg" width="256" height="512" viewBox="0 0 256 512" fill="none">
  <title>5L食用油油桶线性图标</title>
  <desc>规整粗线条、无填充、宽桶身、小瓶盖、宽肩、圆角平底桶身，桶身内部标注 5L。</desc>

  <g stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer bottle: wider body, straight shoulder-to-neck taper, rounded body corners -->
    <path d="M82 136
             L28 202
             C20 216 14 232 14 248
             V438
             C14 473 43 496 79 496
             H177
             C213 496 242 473 242 438
             V248
             C242 232 236 216 228 202
             L174 136
             Z" />

    <!-- neck: straight taper into the bottle mouth -->
    <path d="M104 92
             L82 136
             H174
             L152 92" />

    <!-- cap -->
    <rect x="96" y="42" width="64" height="36" rx="6" ry="6" />

    <!-- cap ring: kept short to avoid left-side extra stub -->
    <path d="M94 84 H162" stroke-width="12" />

    <!-- 5L mark -->
    <text x="128" y="338"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="100"
          font-weight="700"
          fill="currentColor"
          stroke="none">5L</text>
  </g>
</svg>
