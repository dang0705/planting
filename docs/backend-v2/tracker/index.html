<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青花植后端 v2 模块进度</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7f4; color: #183025; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px; }
    .notice { background: #fff8e6; border: 1px solid #e8c46a; padding: 12px 16px; border-radius: 8px; }
    .overall { background: white; border-radius: 12px; padding: 18px; margin-top: 16px; box-shadow: 0 2px 10px #18302512; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
    .module { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 10px #18302512; }
    .meta { color: #587063; font-size: 13px; }
    .bar { height: 10px; background: #dce8df; border-radius: 99px; overflow: hidden; margin: 12px 0; }
    .fill { height: 100%; background: #3c9b69; transition: width .2s ease; }
    .ticket { border-top: 1px solid #e6eee8; padding-top: 10px; margin-top: 10px; }
    .ticket-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .ticket-heading strong { flex: 0 0 auto; font-size: 13px; color: #315b46; }
    .ticket-progress-bar { height: 7px; background: #e5ece7; border-radius: 99px; overflow: hidden; margin: 7px 0; }
    .ticket-progress-fill { height: 100%; background: #62ad7f; transition: width .2s ease; }
    .agent-missing { color: #9a5a00; }
    a { color: #18794e; }
  </style>
</head>
<body>
  <main>
    <h1>青花植后端 v2 模块进度</h1>
    <p>按后端架构模块列举任务，不还原 Mermaid。数据来自 <code>module-status.json</code>。</p>
    <div id="notice" class="notice">正在读取状态……</div>
    <section id="overall" class="overall">正在计算总体完成度……</section>
    <section id="modules" class="grid"></section>
  </main>
  <script>
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    function normalizeProgress(value) {
      if (value === null || value === undefined) return 0;
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return 0;
      return Math.min(100, Math.max(0, parsed));
    }

    function hasReportedProgress(value) {
      return value !== null && value !== undefined && Number.isFinite(Number(value));
    }

    function progressLabel(value) {
      if (!hasReportedProgress(value)) return '0%（按 0 计入、非 owner 上报）';
      return `${normalizeProgress(value)}%`;
    }

    // 追踪页使用 innerHTML 渲染状态文件，所有动态文本都先转义，避免状态内容破坏页面结构。
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    async function loadStatus() {
      const response = await fetch('./module-status.json', { cache: 'no-store' });
      const data = await response.json();
      const agents = new Map((data.agentRegistry || []).map((agent) => [agent.name, agent]));
      const snapshotTime = data.generatedAt || '未知';
      document.querySelector('#notice').textContent = `追踪表负责人：${data.trackerOwner || '主代理 /root'}；ClickUp 远端上次确认：${data.clickUpLastSyncedAt || '未核实'}（此后状态不保证实时）${data.clickUpSyncError ? `；同步异常：${data.clickUpSyncError}` : ''}；本地代理快照：${snapshotTime}；页面每 30 分钟自动刷新`;
      const overall = data.overallProgress || { progress: 0, reported: 0, total: 0 };
      document.querySelector('#overall').innerHTML = `
        <strong>总体本地任务进度：${overall.progress}%</strong>
        <div class="bar" aria-label="总体完成进度"><div class="fill" style="width:${overall.progress}%"></div></div>
        <div class="meta">全部任务：${overall.total}；已上报：${overall.reported}；未开始或未上报按 0% 计入；未上报的 0% 为统计规则，非 owner 上报</div>
      `;
      document.querySelector('#modules').innerHTML = (data.modules || []).map((module) => {
        const moduleStatus = module.status || '准备中';
        const moduleAgentNames = [...new Set((module.tickets || []).map((ticket) => ticket.agent).filter(Boolean))];
        const moduleAgent = module.agent || (moduleAgentNames.length ? moduleAgentNames.join('、') : '未分配');
        const tickets = (module.tickets || []).map((ticket) => {
          const agent = ticket.agent ? agents.get(ticket.agent) : null;
          const agentLabel = ticket.agent || `未分配（计划角色：${ticket.plannedAgent || '未指定'}）`;
          const agentIsCurrent = !ticket.agent || Boolean(agent);
          const clickUpStatus = data.clickUpTaskStatuses?.[ticket.id] ?? '未核实';
          return {
            ...ticket,
            title: ticket.title || '未命名任务',
            url: ticket.url || '#',
            status: ticket.status || moduleStatus,
            progress: hasReportedProgress(ticket.progress) ? normalizeProgress(ticket.progress) : null,
            agentLabel,
            agentState: agent ? agent.status : '未在当前代理快照中',
            agentIsCurrent,
            clickUpStatus
          };
        });
        const progressSummary = {
          progress: normalizeProgress(module.progress),
          reported: Number(module.reportedTicketCount || 0),
          total: Number(module.totalTicketCount ?? tickets.length)
        };
        const moduleProgress = progressSummary.progress;
        const moduleProgressWidth = moduleProgress;
        const moduleProgressText = `${moduleProgress}%`;

        return `
        <article class="module">
          <h2>${escapeHtml(module.name || '未命名模块')}</h2>
          <div class="meta">模块：${escapeHtml(module.id || '未知')}　阶段：${escapeHtml(module.phase || '未分配')}</div>
          <div class="meta">计划角色：${escapeHtml(module.plannedAgent || '未指定')}　当前子代理：${escapeHtml(moduleAgent)}</div>
          <div class="bar" aria-label="完成进度"><div class="fill" style="width:${moduleProgressWidth}%"></div></div>
          <div>${escapeHtml(moduleProgressText)}　${escapeHtml(moduleStatus)}</div>
          <div class="meta">已上报任务：${progressSummary.reported}/${progressSummary.total}；未开始或未上报按 0% 计入模块完成度；未上报的 0% 为统计规则，非 owner 上报</div>
          <div class="meta">最后更新：${escapeHtml(module.lastUpdatedAt || '尚未开始')}</div>
          ${tickets.map((ticket) => {
            const ticketProgress = normalizeProgress(ticket.progress);
            return `<div class="ticket">
              <div class="ticket-heading"><a href="${escapeHtml(ticket.url)}" target="_blank" rel="noreferrer">${escapeHtml(ticket.title)}</a><strong>${progressLabel(ticket.progress)}</strong></div>
              <div class="ticket-progress-bar" role="progressbar" aria-label="本地任务进度：${escapeHtml(ticket.title)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${ticketProgress}"><div class="ticket-progress-fill" style="width:${ticketProgress}%"></div></div>
              <div class="meta ${ticket.agentIsCurrent ? '' : 'agent-missing'}">ClickUp（上次远端回读）：${escapeHtml(ticket.clickUpStatus)} · 本地：${escapeHtml(ticket.status)} · ${escapeHtml(ticket.agentLabel)} · ${escapeHtml(ticket.agentState)}</div>
            </div>`;
          }).join('')}
        </article>`;
      }).join('');
    }

    loadStatus().catch((error) => { document.querySelector('#notice').textContent = `状态读取失败：${error.message}`; });
    // 30 分钟刷新的是本地代理快照；快照写入仍必须由主代理/负责人按心跳合同完成。
    window.setInterval(() => {
      loadStatus().catch((error) => { document.querySelector('#notice').textContent = `状态刷新失败：${error.message}`; });
    }, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
