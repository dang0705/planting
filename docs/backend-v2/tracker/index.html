<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青花植后端 v2 模块进度</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7f4; color: #183025; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px; }
    .notice { background: #fff8e6; border: 1px solid #e8c46a; padding: 12px 16px; border-radius: 8px; }
    .overall { background: white; border-radius: 12px; padding: 18px; margin-top: 16px; box-shadow: 0 2px 10px #18302512; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
    .module { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 10px #18302512; }
    .meta { color: #587063; font-size: 13px; }
    .bar { height: 10px; background: #dce8df; border-radius: 99px; overflow: hidden; margin: 12px 0; }
    .fill { height: 100%; background: #3c9b69; transition: width .2s ease; }
    .ticket { border-top: 1px solid #e6eee8; padding-top: 10px; margin-top: 10px; }
    .ticket-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .ticket-heading strong { flex: 0 0 auto; font-size: 13px; color: #315b46; }
    .ticket-progress-bar { height: 7px; background: #e5ece7; border-radius: 99px; overflow: hidden; margin: 7px 0; }
    .ticket-progress-fill { height: 100%; background: #62ad7f; transition: width .2s ease; }
    .agent-missing { color: #9a5a00; }
    a { color: #18794e; }
  </style>
</head>
<body>
  <main>
    <h1>青花植后端 v2 模块进度</h1>
    <p>当前执行记录每小时同步；页面每 30 分钟刷新展示。模块百分比保留历史快照，不根据任务状态估算。</p>
    <section id="execution" class="overall" aria-live="polite">正在读取当前执行记录……</section>
    <h2>历史模块进度快照</h2>
    <div id="notice" class="notice">正在读取状态……</div>
    <section id="overall" class="overall">正在计算总体完成度……</section>
    <section id="modules" class="grid"></section>
  </main>
  <script>
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    function normalizeProgress(value) {
      if (value === null || value === undefined) return 0;
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return 0;
      return Math.min(100, Math.max(0, parsed));
    }

    function hasReportedProgress(value) {
      return value !== null && value !== undefined && Number.isFinite(Number(value));
    }

    function progressLabel(value, heartbeatState) {
      if (!hasReportedProgress(value)) return '0%（按 0 计入、非 owner 上报）';
      if (heartbeatState === 'missing') return `${normalizeProgress(value)}%（历史值；心跳缺失）`;
      if (heartbeatState === 'stale') return `${normalizeProgress(value)}%（历史值；心跳超时）`;
      return `${normalizeProgress(value)}%`;
    }

    // 追踪页使用 innerHTML 渲染状态文件，所有动态文本都先转义，避免状态内容破坏页面结构。
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    // 执行投影只展示两份轻量记录中的事实；验收与模块完成百分比不由页面推断。
    async function loadExecution() {
      const response = await fetch('./execution-progress.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const tasks = Array.isArray(data.tasks) ? data.tasks : [];
      document.querySelector('#execution').innerHTML = `
        <h2>当前执行与同步</h2>
        <strong>当前步骤：${escapeHtml(data.currentStep || '未记录')} · 票据：${escapeHtml(data.currentTicketId || '未记录')}</strong>
        <div class="meta">记录版本：${escapeHtml(data.sourceRevision)}；记录更新时间：${escapeHtml(data.sourceUpdatedAt || '未知')}；投影生成时间：${escapeHtml(data.generatedAt || '未知')}</div>
        <div class="meta">最近成功同步：${escapeHtml(data.lastSuccessfulSyncAt || '尚无记录')}；此时间不代表全部票据均已同步</div>
        ${data.lastFailure ? `<div class="notice">同步异常：${escapeHtml(typeof data.lastFailure === 'string' ? data.lastFailure : JSON.stringify(data.lastFailure))}</div>` : ''}
        ${tasks.map((task) => {
          const sync = task.sync;
          const matched = sync?.matched === true && sync.version === task.version && sync.status === task.status;
          const syncLabel = !sync ? '尚未同步' : matched ? '已同步并读回' : '版本或状态未一致';
          const ticketId = String(task.id || '');
          const title = `${task.step || '未记录步骤'} · ${ticketId || '未记录票据'}`;
          const ticket = /^[a-zA-Z0-9]+$/.test(ticketId)
            ? `<a href="https://app.clickup.com/t/${encodeURIComponent(ticketId)}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a>`
            : escapeHtml(title);
          return `<article class="ticket">
            <div class="ticket-heading">${ticket}<strong>${task.accepted === true ? '已验收' : '未验收'}</strong></div>
            <div class="meta">本地状态：${escapeHtml(task.status || '未记录')} · 阶段：${escapeHtml(task.stage || '未记录')} · 任务版本：${escapeHtml(task.version)}</div>
            <div class="meta">逐票同步：${escapeHtml(syncLabel)}${sync ? `；远端记录版本：${escapeHtml(sync.version)}；远端状态：${escapeHtml(sync.status || '未记录')}` : ''}</div>
            ${sync?.readback ? `<div class="meta">读回依据：${escapeHtml(sync.readback)}</div>` : ''}
            ${(Array.isArray(task.summary) ? task.summary : []).map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
            ${task.blockingReason ? `<div class="notice">阻断：${escapeHtml(task.blockingReason)}</div>` : ''}
            ${task.nextAction ? `<div class="meta">下一步：${escapeHtml(task.nextAction)}</div>` : ''}
          </article>`;
        }).join('') || '<p>尚无执行任务记录</p>'}
      `;
    }

    async function loadStatus() {
      const response = await fetch('./module-status.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const agents = new Map((data.agentRegistry || []).map((agent) => [agent.name, agent]));
      const snapshotTime = data.generatedAt || '未知';
      document.querySelector('#notice').textContent = `历史模块快照：${snapshotTime}；百分比未随当前执行记录更新。追踪表负责人：${data.trackerOwner || '主代理 /root'}；历史 ClickUp 远端上次确认：${data.clickUpLastSyncedAt || '未核实'}（此后状态不保证实时）${data.clickUpSyncError ? `；历史同步异常：${data.clickUpSyncError}` : ''}`;
      const overall = data.overallProgress || { progress: 0, reported: 0, total: 0 };
      document.querySelector('#overall').innerHTML = `
        <strong>历史总体本地任务进度：${overall.progress}%</strong>
        <div class="bar" aria-label="总体完成进度"><div class="fill" style="width:${overall.progress}%"></div></div>
        <div class="meta">全部任务：${overall.total}；已上报：${overall.reported}；未开始或未上报按 0% 计入；未上报的 0% 为统计规则，非 owner 上报</div>
      `;
      document.querySelector('#modules').innerHTML = (data.modules || []).map((module) => {
        const moduleStatus = module.status || '准备中';
        const moduleAgentNames = [...new Set((module.tickets || []).map((ticket) => ticket.agent).filter(Boolean))];
        const moduleAgent = module.agent || (moduleAgentNames.length ? moduleAgentNames.join('、') : '未分配');
        const tickets = (module.tickets || []).map((ticket) => {
          const agent = ticket.agent ? agents.get(ticket.agent) : null;
          const agentLabel = ticket.agent || `未分配（计划角色：${ticket.plannedAgent || '未指定'}）`;
          const agentIsCurrent = !ticket.agent || Boolean(agent);
          const lastFullReadAt = Date.parse(data.clickUpLastSyncedAt || '');
          const singleCheck = data.clickUpSingleTaskChecks?.[ticket.id];
          const singleCheckAt = Date.parse(singleCheck?.confirmedAt || '');
          const hasNewerSingleCheck = Number.isFinite(singleCheckAt)
            && (!Number.isFinite(lastFullReadAt) || singleCheckAt > lastFullReadAt)
            && ['backlog', 'ready for codex', 'codex running', 'human required', 'blocked', 'review needed', 'done'].includes(singleCheck?.status);
          const clickUpStatus = hasNewerSingleCheck
            ? singleCheck.status
            : (data.clickUpTaskStatuses?.[ticket.id] ?? '未核实');
          return {
            ...ticket,
            title: ticket.title || '未命名任务',
            url: ticket.url || '#',
            status: ticket.status || moduleStatus,
            progress: hasReportedProgress(ticket.progress) ? normalizeProgress(ticket.progress) : null,
            agentLabel,
            agentState: agent ? agent.status : '未在当前代理快照中',
            agentIsCurrent,
            clickUpStatus,
            clickUpStatusSource: hasNewerSingleCheck ? '单票已确认' : '上次远端回读'
          };
        });
        const progressSummary = {
          progress: normalizeProgress(module.progress),
          reported: Number(module.reportedTicketCount || 0),
          total: Number(module.totalTicketCount ?? tickets.length)
        };
        const moduleProgress = progressSummary.progress;
        const moduleProgressWidth = moduleProgress;
        const moduleProgressText = `${moduleProgress}%`;

        return `
        <article class="module">
          <h2>${escapeHtml(module.name || '未命名模块')}</h2>
          <div class="meta">模块：${escapeHtml(module.id || '未知')}　阶段：${escapeHtml(module.phase || '未分配')}</div>
          <div class="meta">计划角色：${escapeHtml(module.plannedAgent || '未指定')}　当前子代理：${escapeHtml(moduleAgent)}</div>
          <div class="bar" aria-label="完成进度"><div class="fill" style="width:${moduleProgressWidth}%"></div></div>
          <div>${escapeHtml(moduleProgressText)}　${escapeHtml(moduleStatus)}</div>
          <div class="meta">已上报任务：${progressSummary.reported}/${progressSummary.total}；未开始或未上报按 0% 计入模块完成度；未上报的 0% 为统计规则，非 owner 上报</div>
          <div class="meta">最后更新：${escapeHtml(module.lastUpdatedAt || '尚未开始')}</div>
          ${tickets.map((ticket) => {
            const ticketProgress = normalizeProgress(ticket.progress);
            return `<div class="ticket">
              <div class="ticket-heading"><a href="${escapeHtml(ticket.url)}" target="_blank" rel="noreferrer">${escapeHtml(ticket.title)}</a><strong>${progressLabel(ticket.progress, ticket.heartbeatState)}</strong></div>
              <div class="ticket-progress-bar" role="progressbar" aria-label="本地任务进度：${escapeHtml(ticket.title)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${ticketProgress}"><div class="ticket-progress-fill" style="width:${ticketProgress}%"></div></div>
              <div class="meta ${ticket.agentIsCurrent ? '' : 'agent-missing'}">ClickUp（${escapeHtml(ticket.clickUpStatusSource)}）：${escapeHtml(ticket.clickUpStatus)} · 本地：${escapeHtml(ticket.status)} · ${escapeHtml(ticket.agentLabel)} · ${escapeHtml(ticket.agentState)}</div>
            </div>`;
          }).join('')}
        </article>`;
      }).join('');
    }

    // 两份数据独立读取和报错，避免一份缺失掩盖另一份；刷新展示不触发同步或验收。
    function refreshDisplay() {
      loadExecution().catch((error) => { document.querySelector('#execution').textContent = `当前执行记录读取失败：${error.message}`; });
      loadStatus().catch((error) => { document.querySelector('#notice').textContent = `历史模块快照读取失败：${error.message}`; });
    }
    refreshDisplay();
    window.setInterval(() => {
      refreshDisplay();
    }, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
