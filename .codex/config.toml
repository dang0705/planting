# Token-lean Codex configuration for this repository.
# Use higher models or CloudBase MCP only when the task explicitly requires them.
approval_policy = "never"
sandbox_mode = "workspace-write"

[agents]
  # Keep parallelism bounded. Each thread has its own context cost.
  max_threads = 10
  max_depth = 1
  job_max_runtime_seconds = 1800

[sandbox_workspace_write]
  network_access = false

  [mcp_servers.webstorm]
    url = "http://127.0.0.1:64343/stream"
