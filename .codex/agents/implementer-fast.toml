- `docs/code-logics/INDEX.md`：未涉及 / 已读取，命中文档：
- `planting_ai_diagnosis_source_index.json`：未涉及 / 已读取，命中 source_id：
- All-in-One：未读取 / 已读取章节或 Sxx：

## 使用的规则摘要
- ...

## 修改文件
- 文件：
  - 改动类型：新增 / 修改 / 删除
  - 改动摘要：

## Test Contract 执行情况
