  - id: F-WEATHER-V7-001
    claim_summary: 'weather-http contracts now include timer-triggered recent-10d ingestion (`weather-ingestion-recent-10d`, cron `0 20 0/6 * * * *`) and batch ingestion. Timer events are handled by top-level controlled branch in `app.js` and reuse recent-10d service. Batch ingestion only scans `weather_locations` where `is_active = 1` and `qweather_location_id` is present, with optional `limit`; no global/national city batch. Diagnosis environment-context reads self-owned cache first (`weather:recent10:{locationKey}`, `weather-cache/v1/locations/{locationKey}/recent-10d.json`) and returns 200 with `weather evidence insufficient` or empty `historicalDays` on cache miss; user diagnosis requests must not synchronously call QWeather.'
    source:
      files:
        - cloudfunctions/weather-http/app.js
        - cloudfunctions/weather-http/routes/recent-weather-routes.js
        - cloudfunctions/weather-http/services/weather-window-service.js
